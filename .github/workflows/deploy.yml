name: Deploy Workday Tracker to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install pinned Chromium for browser checks
        run: |
          npx playwright install --with-deps chromium
          release_browser_path=$(node -p "require('playwright').chromium.executablePath()")
          echo "BROWSER_PATH=$release_browser_path" >> "$GITHUB_ENV"

      - name: Production browser checks
        run: npm run test:ui -- --production

      - name: English and Spanish mobile usability checks
        run: npm run test:ux -- --production

      - name: Compact route and stop editing checks
        run: npm run test:route

      - name: Recovery and CSV restore checks
        run: npm run test:recovery

      - name: Display precision and validation usability checks
        run: npm run test:design

      - name: History work and travel duration checks
        run: npm run test:durations

      - name: Production data upgrade checks
        run: npm run test:upgrade

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation
          path: |
            artifacts/history-ui/
            artifacts/mobile-ux/
            artifacts/upgrade-ui/**/report.json
            artifacts/upgrade-ui/**/*.png
          if-no-files-found: ignore

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  webkit:
    name: WebKit iPhone compatibility (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install WebKit
        run: npx playwright install webkit
      - name: Build production app
        run: npm run build
      - name: WebKit data upgrade and iPhone layout checks
        run: npm run test:webkit
      - name: WebKit English and Spanish usability checks
        run: npm run test:ux -- --production --webkit
      - name: WebKit compact route and stop editing checks
        run: npm run test:route -- --webkit
      - name: WebKit recovery and CSV restore checks
        run: npm run test:recovery -- --webkit
      - name: WebKit display precision and validation usability checks
        run: npm run test:design -- --webkit
      - name: WebKit History work and travel duration checks
        run: npm run test:durations -- --webkit
      - name: Upload WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-validation
          path: |
            artifacts/webkit-results/
            artifacts/webkit-report/
            artifacts/mobile-ux/
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: [build, webkit]

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
